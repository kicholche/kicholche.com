<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071a3a">
<title>Kicholche Admin</title>
<style>
:root{--navy:#071a3a;--navy2:#0d2b59;--blue:#1668d9;--cyan:#eaf5ff;--bg:#f4f7fb;--card:#fff;--text:#132238;--muted:#6b7890;--line:#e2e8f0;--danger:#dc3545;--ok:#16855b;--shadow:0 12px 32px rgba(15,35,70,.08)}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Bengali",sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#071a3a,#124d9b)}
.login-card{width:min(440px,100%);background:#fff;border-radius:22px;padding:34px;box-shadow:0 24px 70px #00153b55}
.logo{display:flex;align-items:center;gap:12px;font-weight:800;font-size:22px;color:var(--navy)}.logo-mark{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#20b7ff,#1b55d9);color:#fff;display:grid;place-items:center;font-size:25px;font-weight:900}
.login h1{margin:28px 0 7px;font-size:27px}.sub{color:var(--muted);margin:0 0 24px}.field{margin:15px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px 13px;outline:none;background:#fff}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1668d91c}
.primary{background:var(--blue);color:#fff;border-radius:11px;padding:12px 17px;font-weight:750}.primary:hover{filter:brightness(.95)}.ghost{background:#eef4fb;color:#18345b;border-radius:10px;padding:10px 14px;font-weight:700}.danger{background:#fff0f1;color:#b42332;border-radius:10px;padding:9px 12px;font-weight:700}.msg{padding:11px 13px;border-radius:10px;font-size:14px;margin:12px 0}.error{background:#fff0f1;color:#a31d2d}.success{background:#eaf8f1;color:#0b6d48}.info{background:#eef6ff;color:#17549b}
.shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:var(--navy);color:#dce8fb;padding:20px 14px;position:sticky;top:0;height:100vh}.side .logo{color:#fff;padding:8px 10px 24px}.side .logo-mark{width:40px;height:40px;font-size:21px}.nav{display:grid;gap:5px}.nav button{width:100%;text-align:left;background:transparent;color:#c9d7ec;padding:11px 12px;border-radius:10px}.nav button:hover,.nav button.active{background:#ffffff12;color:#fff}.nav small{display:block;color:#7f94b6;padding:17px 12px 6px;text-transform:uppercase;letter-spacing:.08em}.side-bottom{position:absolute;left:14px;right:14px;bottom:18px}.userbox{font-size:12px;color:#9db0cd;word-break:break-all;padding:10px 12px}.main{min-width:0}.top{height:74px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}.top h2{margin:0;font-size:20px}.top-right{display:flex;gap:10px;align-items:center}.content{padding:26px;max-width:1500px;margin:auto}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:19px;box-shadow:var(--shadow)}.stat .num{font-size:30px;font-weight:850;margin-top:8px}.stat .label{font-size:13px;color:var(--muted)}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.panel-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.panel-head h3{margin:0;font-size:17px}.toolbar{display:flex;gap:9px;flex-wrap:wrap}.search{min-width:220px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:12px 15px;border-bottom:1px solid #edf1f6;text-align:left;font-size:13px;vertical-align:top}.table th{background:#f8fafc;color:#63718a;font-size:12px;text-transform:uppercase}.empty{padding:38px;text-align:center;color:var(--muted)}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;background:#edf5ff;color:#18569f;font-size:11px;font-weight:800}.actions{display:flex;gap:7px}.section-note{margin:0 0 16px;color:var(--muted);font-size:14px}.modal{position:fixed;inset:0;background:#081a3a66;display:grid;place-items:center;padding:20px;z-index:20}.modal-card{width:min(820px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;box-shadow:0 30px 80px #00112f55}.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-body{padding:20px}.modal-foot{padding:15px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}.json{width:100%;min-height:360px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px;line-height:1.5}.toast{position:fixed;right:20px;bottom:20px;z-index:50;max-width:380px;padding:13px 16px;border-radius:12px;background:#102a50;color:#fff;box-shadow:0 15px 40px #00112f33}.loading{opacity:.65;pointer-events:none}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;padding:10px}.side .logo{padding:6px 8px 10px}.nav{display:flex;overflow:auto}.nav small,.side-bottom{display:none}.nav button{white-space:nowrap}.top{padding:0 15px}.content{padding:15px}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.cards{grid-template-columns:1fr}.top h2{font-size:17px}.search{min-width:160px}}
</style>
</head>
<body>
<section id="loginView" class="login">
  <div class="login-card">
    <div class="logo"><span class="logo-mark">K</span><span>Kicholche Admin</span></div>
    <h1>Admin Sign in</h1>
    <p class="sub">Kicholche-এর সব content নিরাপদে পরিচালনা করুন।</p>
    <div id="loginMsg"></div>
    <form id="loginForm">
      <div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required></div>
      <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button id="loginBtn" class="primary" style="width:100%" type="submit">Sign in</button>
    </form>
  </div>
</section>

<section id="appView" class="shell hidden">
  <aside class="side">
    <div class="logo"><span class="logo-mark">K</span><span>Kicholche</span></div>
    <div class="nav" id="nav"></div>
    <div class="side-bottom"><div id="userEmail" class="userbox"></div><button id="logout" class="ghost" style="width:100%">Sign out</button></div>
  </aside>
  <main class="main">
    <header class="top"><h2 id="pageTitle">Dashboard</h2><div class="top-right"><span id="status" class="badge">Connected</span><a href="./" class="ghost">View site</a></div></header>
    <div id="content" class="content"></div>
  </main>
</section>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head"><strong id="modalTitle">Add record</strong><button id="closeModal" class="ghost">Close</button></div>
    <div class="modal-body">
      <p class="section-note">JSON editor ব্যবহার করে এই section-এর সম্পূর্ণ record যোগ বা পরিবর্তন করুন।</p>
      <textarea id="jsonEditor" class="json" spellcheck="false"></textarea>
      <div id="modalMsg"></div>
    </div>
    <div class="modal-foot"><button id="cancelModal" class="ghost">Cancel</button><button id="saveBtn" class="primary">Save record</button></div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>

<script>
(function(){
"use strict";
const CONFIG=window.KICHOLOCHE_CONFIG||{SUPABASE_URL:"https://pwjybkbwxvpdlwhwosqs.supabase.co",SUPABASE_ANON_KEY:"sb_publishable_KcTjG65BQZRr1PlPkUzHew_G7RquhdB"};
const $=s=>document.querySelector(s);
const tables=[
 ["government_updates","Government Updates"],["jobs","Jobs"],["scholarships","Scholarships"],["results","Results"],
 ["form_fill_up","Form Fill-up"],["schemes","Schemes"],["lottery_results","Lottery Results"],["ai_tools","AI Tools"],
 ["breaking_news","Breaking News"],["quick_links","Quick Links"]
];
const state={token:null,user:null,table:"government_updates",rows:[],edit:null};
const api=(path,opt={})=>fetch(CONFIG.SUPABASE_URL+path,{...opt,headers:{"apikey":CONFIG.SUPABASE_ANON_KEY,"Content-Type":"application/json",...(state.token?{Authorization:"Bearer "+state.token}:{}) ,...(opt.headers||{})}});
function msg(el,text,type="error"){el.innerHTML=text?'<div class="msg '+type+'">'+esc(text)+'</div>':""}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function toast(t){const x=$("#toast");x.textContent=t;x.classList.remove("hidden");setTimeout(()=>x.classList.add("hidden"),2800)}
function saveSession(){localStorage.setItem("kicholche_admin_session",JSON.stringify({access_token:state.token,user:state.user}))}
function clearSession(){localStorage.removeItem("kicholche_admin_session")}
async function authLogin(email,password){
 const r=await fetch(CONFIG.SUPABASE_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"apikey":CONFIG.SUPABASE_ANON_KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password})});
 const d=await r.json().catch(()=>({}));
 if(!r.ok) throw new Error(d.error_description||d.msg||d.message||"Login failed");
 if(!d.access_token||!d.user) throw new Error("Supabase returned an incomplete session.");
 return d;
}
async function verifyAdmin(userId){
 const r=await api("/rest/v1/admin_users?select=*&user_id=eq."+encodeURIComponent(userId)+"&limit=1");
 const d=await r.json().catch(()=>[]);
 if(!r.ok) throw new Error(d.message||"Admin permission check failed.");
 return Array.isArray(d)&&d.length>0;
}
async function loadTable(table){
 const r=await api("/rest/v1/"+encodeURIComponent(table)+"?select=*&order=created_at.desc&limit=100");
 let d=await r.json().catch(()=>[]);
 if(!r.ok && r.status===400){const r2=await api("/rest/v1/"+encodeURIComponent(table)+"?select=*&limit=100");d=await r2.json().catch(()=>[]);if(!r2.ok)throw new Error(d.message||"Could not load data.");}
 else if(!r.ok) throw new Error(d.message||"Could not load data.");
 return Array.isArray(d)?d:[];
}
async function createRecord(table,payload){
 const r=await api("/rest/v1/"+encodeURIComponent(table),{method:"POST",headers:{Prefer:"return=representation"},body:JSON.stringify(payload)});
 const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||d.hint||"Could not create record.");return d;
}
async function updateRecord(table,key,value,payload){
 const r=await api("/rest/v1/"+encodeURIComponent(table)+"?"+encodeURIComponent(key)+"=eq."+encodeURIComponent(value),{method:"PATCH",headers:{Prefer:"return=representation"},body:JSON.stringify(payload)});
 const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||d.hint||"Could not update record.");return d;
}
async function deleteRecord(table,key,value){
 const r=await api("/rest/v1/"+encodeURIComponent(table)+"?"+encodeURIComponent(key)+"=eq."+encodeURIComponent(value),{method:"DELETE",headers:{Prefer:"return=minimal"}});
 const d=await r.text();if(!r.ok)throw new Error(d||"Could not delete record.");
}
function renderNav(){
 const nav=$("#nav");nav.innerHTML='<small>Content</small>'+tables.map(([t,l])=>'<button data-table="'+t+'">'+l+'</button>').join("")+'<small>System</small><button data-table="dashboard">Dashboard</button>';
 nav.querySelectorAll("button").forEach(b=>b.onclick=()=>openSection(b.dataset.table));
}
function displayValue(v){if(v===null||v===undefined)return "—";if(typeof v==="object")return JSON.stringify(v);return String(v)}
async function openSection(table){
 if(table==="dashboard"){renderDashboard();return}
 state.table=table;const label=tables.find(x=>x[0]===table)?.[1]||table;$("#pageTitle").textContent=label;
 document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.table===table));
 $("#content").innerHTML='<div class="panel"><div class="empty">Loading…</div></div>';
 try{state.rows=await loadTable(table);renderTable()}catch(e){$("#content").innerHTML='<div class="panel"><div class="empty"><div class="msg error">'+esc(e.message)+'</div></div></div>'}
}
function renderTable(){
 const rows=state.rows;let cols=[];
 rows.forEach(r=>Object.keys(r).forEach(k=>{if(!cols.includes(k)&&cols.length<7)cols.push(k)}));
 if(!cols.length) cols=["id"];
 const label=tables.find(x=>x[0]===state.table)?.[1]||state.table;
 $("#content").innerHTML='<p class="section-note">এই section-এর records এখানে যোগ, edit এবং delete করা যাবে।</p>'+
 '<div class="panel"><div class="panel-head"><h3>'+esc(label)+' <span class="badge">'+rows.length+'</span></h3><div class="toolbar"><input id="search" class="search" placeholder="Search…"><button id="add" class="primary">+ Add record</button></div></div>'+
 '<div class="table-wrap"><table class="table"><thead><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join("")+'<th>Action</th></tr></thead><tbody>'+
 (rows.length?rows.map((r,i)=>'<tr>'+cols.map(c=>'<td>'+esc(displayValue(r[c]).slice(0,180))+'</td>').join("")+
 '<td><div class="actions"><button class="ghost edit" data-i="'+i+'">Edit</button><button class="danger del" data-i="'+i+'">Delete</button></div></td></tr>').join(""):'<tr><td colspan="'+(cols.length+1)+'"><div class="empty">No records yet</div></td></tr>')+
 '</tbody></table></div></div>';
 $("#add").onclick=()=>openEditor(null);
 $("#content").querySelectorAll(".edit").forEach(b=>b.onclick=()=>openEditor(state.rows[+b.dataset.i]));
 $("#content").querySelectorAll(".del").forEach(b=>b.onclick=()=>removeRow(state.rows[+b.dataset.i]));
 $("#search").oninput=e=>filterRows(e.target.value);
}
function filterRows(q){const query=q.toLowerCase();document.querySelectorAll(".table tbody tr").forEach(tr=>tr.style.display=tr.textContent.toLowerCase().includes(query)?"":"none")}
function keyFor(row){return ["id","uuid","user_id","slug"].find(k=>row&&row[k]!==undefined&&row[k]!==null)}
function openEditor(row){
 state.edit=row;$("#modalTitle").textContent=row?"Edit record":"Add record";$("#modalMsg").innerHTML="";
 $("#jsonEditor").value=JSON.stringify(row||{},null,2);$("#modal").classList.remove("hidden");
}
function closeEditor(){$("#modal").classList.add("hidden");state.edit=null}
async function save(){
 let payload;try{payload=JSON.parse($("#jsonEditor").value)}catch(e){msg($("#modalMsg"),"JSON ঠিক নয়। Please check the format.");return}
 const btn=$("#saveBtn");btn.disabled=true;btn.textContent="Saving…";
 try{
  if(state.edit){
   const key=keyFor(state.edit);if(!key)throw new Error("এই record-এর update করার primary key পাওয়া যায়নি।");
   delete payload[key];await updateRecord(state.table,key,state.edit[key],payload);
   toast("Record updated successfully.");
  }else{await createRecord(state.table,payload);toast("Record added successfully.")}
  closeEditor();await openSection(state.table);
 }catch(e){msg($("#modalMsg"),e.message)}finally{btn.disabled=false;btn.textContent="Save record"}
}
async function removeRow(row){
 const key=keyFor(row);if(!key)return toast("Delete key পাওয়া যায়নি।");
 if(!confirm("এই recordটি delete করতে চান?"))return;
 try{await deleteRecord(state.table,key,row[key]);toast("Record deleted.");await openSection(state.table)}catch(e){toast(e.message)}
}
async function renderDashboard(){
 $("#pageTitle").textContent="Dashboard";document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.table==="dashboard"));
 $("#content").innerHTML='<p class="section-note">Kicholche content management-এর overview.</p><div id="stats" class="cards"></div><div style="height:18px"></div><div class="panel"><div class="panel-head"><h3>Quick actions</h3></div><div style="padding:20px;display:flex;gap:9px;flex-wrap:wrap">'+tables.map(x=>'<button class="ghost quick" data-t="'+x[0]+'">'+x[1]+'</button>').join("")+'</div></div>';
 const stats=$("#stats");stats.innerHTML=tables.slice(0,4).map(x=>'<div class="stat"><div class="label">'+x[1]+'</div><div class="num">…</div></div>').join("");
 const counts=await Promise.all(tables.slice(0,4).map(async x=>{try{return (await loadTable(x[0])).length}catch(e){return 0}}));
 stats.querySelectorAll(".num").forEach((n,i)=>n.textContent=counts[i]);
 $("#content").querySelectorAll(".quick").forEach(b=>b.onclick=()=>openSection(b.dataset.t));
}
async function enter(session){
 state.token=session.access_token;state.user=session.user;
 const ok=await verifyAdmin(state.user.id);if(!ok)throw new Error("এই accountটি Kicholche admin_users-এ অনুমোদিত নয়.");
 saveSession();$("#userEmail").textContent=state.user.email||"";$("#loginView").classList.add("hidden");$("#appView").classList.remove("hidden");renderNav();await renderDashboard();
}
$("#loginForm").onsubmit=async e=>{
 e.preventDefault();const btn=$("#loginBtn");btn.disabled=true;btn.textContent="Signing in…";msg($("#loginMsg"),"");
 try{const d=await authLogin($("#email").value.trim(),$("#password").value);await enter(d)}catch(e){msg($("#loginMsg"),e.message)}finally{btn.disabled=false;btn.textContent="Sign in"}
};
$("#logout").onclick=()=>{clearSession();state.token=null;state.user=null;$("#appView").classList.add("hidden");$("#loginView").classList.remove("hidden");$("#password").value=""};
$("#closeModal").onclick=closeEditor;$("#cancelModal").onclick=closeEditor;$("#saveBtn").onclick=save;
window.addEventListener("keydown",e=>{if(e.key==="Escape")closeEditor()});
renderNav();
try{const saved=JSON.parse(localStorage.getItem("kicholche_admin_session")||"null");if(saved?.access_token&&saved?.user)enter(saved).catch(()=>clearSession())}catch(e){clearSession()}
})();
</script>
<script src="config.js"></script>
</body>
</html>
