<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kicholche Admin</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"><style>body{margin:0;background:#f5f8fc;font:14px Inter;color:#17365d}.wrap{max-width:1050px;margin:40px auto;padding:0 20px}.card{background:#fff;border:1px solid #dbe7f3;border-radius:14px;padding:22px;margin-bottom:16px;box-shadow:0 5px 18px #153c5d12}h1{color:#061c44}button{background:#0b63ff;color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer}input,select,textarea{width:100%;padding:10px;border:1px solid #cfddec;border-radius:8px;margin:6px 0 12px;box-sizing:border-box}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #e6eef6;text-align:left}.danger{background:#ef3340}.muted{color:#7187a0}</style></head><body><div class="wrap"><div class="card"><h1>Kicholche Admin</h1><p class="muted">Secure Supabase-authenticated content management foundation.</p><div id="auth"><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button id="login">Sign in</button></div><div id="session" hidden><button id="logout" class="danger">Sign out</button></div></div><div id="dashboard" hidden><div class="card"><h2>Content overview</h2><table><thead><tr><th>Section</th><th>Rows</th></tr></thead><tbody id="counts"></tbody></table></div><div class="card"><h2>Homepage controls</h2><p class="muted">Use Supabase Table Editor or the production admin CRUD modules to publish content. The public site reads only approved/published records.</p><a href="./" style="color:#0b63ff">← Back to website</a></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const sb=window.supabase.createClient(KICHOLOCHE_CONFIG.SUPABASE_URL,KICHOLOCHE_CONFIG.SUPABASE_ANON_KEY);const auth=document.querySelector('#auth'),session=document.querySelector('#session'),dash=document.querySelector('#dashboard');document.querySelector('#login').onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error)alert(error.message);else location.reload()};document.querySelector('#logout').onclick=async()=>{await sb.auth.signOut();location.reload()};(async()=>{const{data}=await sb.auth.getSession();if(!data.session)return;auth.hidden=true;session.hidden=false;dash.hidden=false;const tables=['government_updates','jobs','scholarships','results','form_fill_up','schemes','lottery_results','ai_tools','breaking_news'];document.querySelector('#counts').innerHTML=(await Promise.all(tables.map(async t=>{const{count}=await sb.from(t).select('*',{count:'exact',head:true});return '<tr><td>'+t+'</td><td>'+(count??0)+'</td></tr>'}))).join('')})()</script></body></html>
